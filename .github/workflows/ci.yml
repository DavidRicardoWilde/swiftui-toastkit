name: CI

# Runs on Linux only: this repository does not use GitHub's macOS runners. Build the
# package, run `swift test`, and build Examples/ToastKitDemo locally in Xcode before
# opening a pull request (see AGENTS.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: swiftlint lint --quiet --strict --config .swiftlint.yml
