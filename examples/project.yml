# One example app per platform ToastKit supports, each built against the package in
# this repository. Generate the Xcode project with XcodeGen, from this folder:
#
#   brew install xcodegen
#   xcodegen generate
#   open ToastKitExamples.xcodeproj
#
# The generated project is not committed.
name: ToastKitExamples

options:
  bundleIdPrefix: com.example.toastkit
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
    visionOS: "1.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: ToastKit
    CODE_SIGN_STYLE: Automatic

packages:
  ToastKit:
    path: ..

targets:
  iOSExample:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - package: ToastKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.toastkit.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme: {}

  macOSExample:
    type: application
    platform: macOS
    sources: [macOS, Shared]
    dependencies:
      - package: ToastKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.toastkit.macos
        # Signed to run locally, so the example opens without a development team.
        CODE_SIGN_IDENTITY: "-"
    scheme: {}

  watchOSExample:
    type: application
    platform: watchOS
    sources: [watchOS, Shared]
    dependencies:
      - package: ToastKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.toastkit.watchos
        INFOPLIST_KEY_WKWatchOnly: YES
    scheme: {}

  visionOSExample:
    type: application
    platform: visionOS
    sources: [visionOS, Shared]
    dependencies:
      - package: ToastKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.toastkit.visionos
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    scheme: {}
